# Generate the Xcode project with `xcodegen` (brew install xcodegen). The .xcodeproj isn't committed.
name: Splits
options:
  bundleIdPrefix: com.bytefabrika
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: SH5W9F58G9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  # Updates for copies downloaded from GitHub. Pinned: a new Sparkle is a deliberate upgrade.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Splits:
    type: application
    platform: macOS
    sources: [Splits, Shared]
    dependencies:
      - target: SplitsWidget
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bytefabrika.splits
        PRODUCT_NAME: Splits
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys (feed, public key, sandbox installer); merged with the generated plist.
        INFOPLIST_FILE: Splits/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Splits
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Bytefabrika"
        CODE_SIGN_ENTITLEMENTS: Splits/Splits.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FoundationModels exists from macOS 26; the app still runs on 14 without the coach.
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
  SplitsWidget:
    type: app-extension
    platform: macOS
    sources: [SplitsWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bytefabrika.splits.widget
        PRODUCT_NAME: SplitsWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SplitsWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Splits
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Bytefabrika"
        CODE_SIGN_ENTITLEMENTS: SplitsWidget/SplitsWidget.entitlements
        SKIP_INSTALL: YES
  SplitsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SplitsTests]
    dependencies:
      - target: Splits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bytefabrika.splits.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Splits.app/Contents/MacOS/Splits"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Splits:
    build:
      targets:
        Splits: all
        SplitsTests: [test]
    test:
      targets: [SplitsTests]
